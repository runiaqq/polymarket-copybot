[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "worker"]

[project]
name = "polymarket-copybot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Telegram
    "python-telegram-bot>=21.3",

    # DB
    "supabase>=2.5.0",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Wallet / Blockchain
    "web3>=6.19.0",
    "eth-account>=0.11.0",
    "cryptography>=42.0.0",

    # Polymarket
    "py-clob-client-v2>=0.1.0",
    "websockets>=12.0",

    # AI
    "openai>=1.30.0",

    # Utils
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
